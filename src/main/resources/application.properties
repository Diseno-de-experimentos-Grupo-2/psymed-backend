# Spring Application Name
spring.application.name=Psymed Platform

# Server
server.port=${SERVER_PORT:8080}

# Spring DataSource Configuration (override via env in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/psymed?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=true

spring.jpa.hibernate.naming.physical-strategy=com.closedsource.psymed.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Elements that take values from pom.xml
documentation.application.version=@project.version@
documentation.application.description=@project.description@

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Actuator (health check for Docker)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
