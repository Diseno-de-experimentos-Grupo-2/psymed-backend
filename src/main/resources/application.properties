# Spring Application Name
spring.application.name=Psymed Platform

# Server
server.port=${SERVER_PORT:8080}

# Spring DataSource Configuration (override via env in Render / Docker)
# Neon example: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/psymed}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=true

spring.jpa.hibernate.naming.physical-strategy=com.closedsource.psymed.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Elements that take values from pom.xml
documentation.application.version=@project.version@
documentation.application.description=@project.description@

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# CORS allowed origins (comma-separated). Set to the Vercel frontend URL in production.
# Supports patterns, e.g. https://*.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Actuator (health check for Docker)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
